name: Build Windows Agent

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.goarch }}
    # We use Ubuntu because it is the fastest and cheapest GitHub runner, 
    # and Go cross-compiles to Windows perfectly from Linux.
    runs-on: ubuntu-latest 
    
    strategy:
      matrix:
        # This matrix tells the action to run twice: once for amd64, once for arm64
        goarch: [amd64, arm64]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Use a recent Go version

    - name: Install Dependencies
      run: go mod download

    - name: Build Executable
      env:
        GOOS: windows
        GOARCH: ${{ matrix.goarch }}
      # We use the exact same build flags we used locally on your Mac
      run: |
        go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Agent-${{ matrix.goarch }}.exe .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Applivery-SOAR-Agent-Windows-${{ matrix.goarch }}
        path: Applivery-SOAR-Agent-${{ matrix.goarch }}.exe
        retention-days: 7