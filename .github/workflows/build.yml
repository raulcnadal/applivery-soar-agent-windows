name: Build Windows Agent & MSI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build MSI for ${{ matrix.goarch }}
    # We are back on Linux, which builds significantly faster!
    runs-on: ubuntu-latest 
    
    strategy:
      matrix:
        include:
          - goarch: amd64
            wixarch: x64
          - goarch: arm64
            wixarch: aarch64

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'

    - name: Install wixl (Linux MSI Compiler)
      # Mirroring the logic from your Dockerfile to install the msitools suite
      run: |
        sudo apt-get update
        sudo apt-get install -y wixl msitools

    - name: Install Go Dependencies
      run: go mod download

    - name: Build Go Executable
      env:
        GOOS: windows
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Agent.exe .

    - name: Compile MSI via wixl
      # Mirroring the subprocess command from your main.py
      run: |
        wixl -a ${{ matrix.wixarch }} -o Applivery-SOAR-Agent-${{ matrix.goarch }}.msi agent.wxs

    - name: Upload MSI Artifact
      uses: actions/upload-artifact@v5
      with:
        name: Applivery-SOAR-Agent-MSI-${{ matrix.goarch }}
        path: Applivery-SOAR-Agent-${{ matrix.goarch }}.msi
        retention-days: 7