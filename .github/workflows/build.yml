name: Build Agent MSIs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Needed for the release step below to publish/update the "latest" tag's
# GitHub Release via the workflow's own auto-issued GITHUB_TOKEN — no PAT
# required for same-repo release publishing.
permissions:
  contents: write

jobs:
  build-windows:
    name: Build All MSIs (Windows / WiX v4)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x' # Updated to match your Linux job's version

      - name: Install WiX Toolset v4
        run: dotnet tool install --global wix --version "4.*"

      # github.com/0xrawsec/golang-etw (added for the ETW event-driven
      # detection watcher, etw_windows.go) has its go.sum hash resolved here
      # rather than pre-committed: the dev environment that wrote this
      # dependency has no Go toolchain / network route to the module proxy
      # to compute it locally. `go mod tidy` scans the source for the new
      # import and fills in go.mod/go.sum using this runner's real network
      # access. Safe to run on every build — a no-op once a maintainer runs
      # it locally and commits the fully-resolved go.sum.
      - name: Tidy Go modules
        run: go mod tidy

      # goversioninfo turns versioninfo/*.json into a resource.syso next to
      # each package's main.go — `go build` links in any *.syso file it
      # finds in a package directory automatically, no extra build flags
      # needed. This is what gives each exe a real embedded VERSIONINFO
      # resource (FileVersion, CompanyName, ProductName, ...) instead of
      # Windows falling back to showing "0.0.0.0"/no publisher in Explorer's
      # Properties dialog and in Windows Error Reporting. Each JSON also
      # sets IconPath (tray/icons/app-icon.ico) so the compiled exe carries
      # a real Applivery icon as its IDI_APPLICATION resource — this is what
      # Windows shows as the app's identity icon on Shell_NotifyIcon balloon
      # notifications (tray/main.go's showBalloon) instead of falling back
      # to a generic default icon when Applivery-SOAR-Tray.exe has none.
      # continue-on-error here: version metadata is cosmetic, never worth
      # failing the whole build over if the tool's CLI surface has drifted.
      - name: Install goversioninfo
        continue-on-error: true
        shell: bash
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      # ---------------------------------------------------
      # 1. BUILD x64 MSI
      # ---------------------------------------------------
      # goversioninfo has no "-arm64" flag (there's only the boolean -64/-arm,
      # combined to mean the four GOARCH families) -- rather than guess the
      # right combination by hand, set GOARCH on the invocation itself and
      # let the tool's own documented auto-detection pick -64/-arm from it,
      # exactly the way its README describes as the primary, supported path.
      - name: Generate x64 version-info resources
        continue-on-error: true
        shell: bash
        env:
          GOARCH: amd64
        run: |
          rm -f resource.syso watchdog/resource.syso tray/resource.syso
          goversioninfo -o resource.syso versioninfo/agent.json
          goversioninfo -o watchdog/resource.syso versioninfo/watchdog.json
          goversioninfo -o tray/resource.syso versioninfo/tray.json

      - name: Build Go x64 Executable
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Agent.exe .

      # Watchdog + Tray (internal/svcwatch, watchdog/, tray/ — the
      # anti-tampering + tray-icon feature) are separate `go build` targets,
      # not part of the root package: each is its own `package main` in its
      # own directory, producing its own exe that agent.wxs installs
      # alongside Applivery-SOAR-Agent.exe.
      - name: Build Go x64 Watchdog + Tray Executables
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Watchdog.exe ./watchdog
          go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Tray.exe ./tray

      - name: Compile x64 MSI
        run: wix build -arch x64 -out Applivery-SOAR-Agent-amd64.msi agent.wxs

      - name: Upload x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Applivery-SOAR-Agent-amd64
          path: Applivery-SOAR-Agent-amd64.msi

      # ---------------------------------------------------
      # 1b. PUBLISH x64 MSI to the SOAR backend's own zero-config download
      #     endpoint (POST /api/internal/agent-builds/windows) — this is
      #     what lets a customer download the agent from Settings > Device
      #     Data Webhook with no GitHub token at all, same idea as this
      #     app's own public Docker images. X-Agent-Arch: amd64 identifies
      #     which of the two Windows variants this is (the backend stores
      #     one row per platform+arch) — the ARM64 build gets its own
      #     publish step below, step 2b. Requires the SOAR_AGENT_BUILD_SECRET
      #     repo secret — a single operator-held value that must match
      #     AGENT_BUILD_INGEST_SECRET on the backend deployment (NOT a
      #     GitHub PAT, and nothing customer/workspace-specific). Runs on
      #     push to main only — PR builds don't touch the live backend.
      # ---------------------------------------------------
      - name: Publish x64 MSI to SOAR backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SOAR_BASE_URL: ${{ vars.SOAR_BASE_URL || 'https://soar.mi-labs.es' }}
          SOAR_AGENT_BUILD_SECRET: ${{ secrets.SOAR_AGENT_BUILD_SECRET }}
        run: |
          if [ -z "$SOAR_AGENT_BUILD_SECRET" ]; then
            echo "SOAR_AGENT_BUILD_SECRET is not set on this repo — skipping zero-config publish (the GitHub Release below still publishes normally)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$SOAR_BASE_URL/api/internal/agent-builds/windows" \
            -H "X-Agent-Build-Secret: $SOAR_AGENT_BUILD_SECRET" \
            -H "X-Agent-Filename: Applivery-SOAR-Agent-amd64.msi" \
            -H "X-Agent-Content-Type: application/x-msi" \
            -H "X-Agent-Version: ${{ github.sha }}" \
            -H "X-Agent-Arch: amd64" \
            --data-binary @Applivery-SOAR-Agent-amd64.msi

      # ---------------------------------------------------
      # 2. BUILD ARM64 MSI
      # ---------------------------------------------------
      # The x64 .syso files above are amd64-machine-type COFF objects — the
      # ARM64 linker will reject them (or worse, silently mislink), so the
      # very first thing this step does is unconditionally delete them,
      # ahead of any goversioninfo call. Combined with the job's default
      # `set -e` and this step's own continue-on-error, the worst case if
      # goversioninfo itself fails here is "ARM64 build has no version
      # info" — never "ARM64 build links against x64 resources."
      - name: Generate ARM64 version-info resources
        continue-on-error: true
        shell: bash
        env:
          GOARCH: arm64
        run: |
          rm -f resource.syso watchdog/resource.syso tray/resource.syso
          goversioninfo -o resource.syso versioninfo/agent.json
          goversioninfo -o watchdog/resource.syso versioninfo/watchdog.json
          goversioninfo -o tray/resource.syso versioninfo/tray.json

      - name: Build Go ARM64 Executable
        env:
          GOOS: windows
          GOARCH: arm64
        # This overwrites the x64 exe so WiX picks up the ARM one natively
        run: go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Agent.exe .

      - name: Build Go ARM64 Watchdog + Tray Executables
        env:
          GOOS: windows
          GOARCH: arm64
        run: |
          go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Watchdog.exe ./watchdog
          go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Tray.exe ./tray

      - name: Compile ARM64 MSI
        run: wix build -arch arm64 -out Applivery-SOAR-Agent-arm64.msi agent.wxs

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Applivery-SOAR-Agent-arm64
          path: Applivery-SOAR-Agent-arm64.msi

      # ---------------------------------------------------
      # 2b. PUBLISH ARM64 MSI to the SOAR backend — same idea as step 1b
      #     above, tagged X-Agent-Arch: arm64 so the backend stores it as
      #     its own distinct (windows, arm64) build/asset rather than
      #     overwriting the x64 one.
      # ---------------------------------------------------
      - name: Publish ARM64 MSI to SOAR backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SOAR_BASE_URL: ${{ vars.SOAR_BASE_URL || 'https://soar.mi-labs.es' }}
          SOAR_AGENT_BUILD_SECRET: ${{ secrets.SOAR_AGENT_BUILD_SECRET }}
        run: |
          if [ -z "$SOAR_AGENT_BUILD_SECRET" ]; then
            echo "SOAR_AGENT_BUILD_SECRET is not set on this repo — skipping zero-config publish (the GitHub Release below still publishes normally)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$SOAR_BASE_URL/api/internal/agent-builds/windows" \
            -H "X-Agent-Build-Secret: $SOAR_AGENT_BUILD_SECRET" \
            -H "X-Agent-Filename: Applivery-SOAR-Agent-arm64.msi" \
            -H "X-Agent-Content-Type: application/x-msi" \
            -H "X-Agent-Version: ${{ github.sha }}" \
            -H "X-Agent-Arch: arm64" \
            --data-binary @Applivery-SOAR-Agent-arm64.msi

      # ---------------------------------------------------
      # 3. PUBLISH — rolling "latest" GitHub Release, same tag reused on
      #    every push to main (same pattern as applivery-soar's own
      #    docker-publish.yml :latest tag). This repo is private, so
      #    the migrated SOAR app's Settings > Applivery SOAR Agent page
      #    proxies these release assets through its own backend (which
      #    needs a read-scoped GitHub token, configured there) rather
      #    than linking to github.com directly. PR builds only run the
      #    two steps above (artifact upload, for review) — only pushes
      #    to main publish a release.
      # ---------------------------------------------------
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automated build from ${{ github.sha }}
          make_latest: true
          files: |
            Applivery-SOAR-Agent-amd64.msi
            Applivery-SOAR-Agent-arm64.msi