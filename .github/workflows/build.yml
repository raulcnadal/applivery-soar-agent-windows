name: Build Windows Agent & MSI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build MSI for ${{ matrix.goarch }}
    runs-on: windows-latest 
    
    strategy:
      matrix:
        include:
          - goarch: amd64
            wixarch: x64
          - goarch: arm64
            wixarch: arm64

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'

    - name: Install Dependencies
      run: go mod download

    - name: Build Go Executable
      env:
        GOOS: windows
        GOARCH: ${{ matrix.goarch }}
      # We use PowerShell explicitly on the Windows runner
      shell: pwsh
      run: |
        go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Agent.exe .

    - name: Compile WiX Installer (candle)
      shell: pwsh
      # -arch dynamically sets the MSI architecture based on our matrix
      # -dPlatform passes the architecture variable into the agent.wxs file
      run: |
        & "C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe" -arch ${{ matrix.wixarch }} -dPlatform=${{ matrix.wixarch }} agent.wxs -out agent.wixobj

    - name: Link WiX Installer (light)
      shell: pwsh
      run: |
        & "C:\Program Files (x86)\WiX Toolset v3.11\bin\light.exe" -ext WixUIExtension agent.wixobj -out Applivery-SOAR-Agent-${{ matrix.goarch }}.msi

    - name: Upload MSI Artifact
      uses: actions/upload-artifact@v5
      with:
        name: Applivery-SOAR-Agent-MSI-${{ matrix.goarch }}
        path: Applivery-SOAR-Agent-${{ matrix.goarch }}.msi
        retention-days: 7