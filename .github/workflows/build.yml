name: Build Windows Agent

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.goarch }}
    runs-on: ubuntu-latest 
    
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
    - name: Checkout Repository
      # Bumped from v4 to v5
      uses: actions/checkout@v5

    - name: Setup Go
      # Bumped from v5 to v6
      uses: actions/setup-go@v6
      with:
        go-version: '1.22'

    - name: Install Dependencies
      run: go mod download

    - name: Build Executable
      env:
        GOOS: windows
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -ldflags="-H windowsgui -s -w" -o Applivery-SOAR-Agent-${{ matrix.goarch }}.exe .

    - name: Upload Artifact
      # Bumped from v4 to v5
      uses: actions/upload-artifact@v5
      with:
        name: Applivery-SOAR-Agent-Windows-${{ matrix.goarch }}
        path: Applivery-SOAR-Agent-${{ matrix.goarch }}.exe
        retention-days: 7